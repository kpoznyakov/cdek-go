      "post" : {
        "tags" : [ "prealert" ],
        "summary" : "Регистрация преалерта",
        "description" : "Метод предназначен для регистрации преалерта (реестра заказов, которые клиент собирается передать на склад СДЭК для дальнейшей доставки) - информирования со стороны интернет-магазина (далее ИМ) о желании передать некоторое количество заказов в СДЭК, чтобы к этому моменту принимающий офис подготовил необходимые документы. \nПреалерт нужен, только если ИМ собирается передавать большое количество заказов одновременно. Для работы с преалертом необходимо, чтобы услуга \"Преалерт\" была подключена по договору. По этому вопросу необходимо обратиться напрямую к закрепленному менеджеру или в закрепленный офис СДЭК (с кем подписывался договор).<br>\nПреалерт не связан с заявкой на вызов курьера.",
        "operationId" : "register",
        "requestBody" : {
          "content" : {
            "application/json" : {
              "schema" : {
                "$ref" : "#/components/schemas/RegisterPrealertRequestDto"
              }
            }
          },
